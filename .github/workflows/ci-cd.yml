name: ci-cd
on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-ejemplo-evaluacion
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: app-ejemplo-evaluacion
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t ghcr.io/xavierstalin/examen:${{ github.sha }} .
      - run: docker push ghcr.io/xavierstalin/examen:${{ github.sha }}
      - run: kubectl set image deployment/web-deployment web=ghcr.io/xavierstalin/examen:${{ github.sha }}
        continue-on-error: true